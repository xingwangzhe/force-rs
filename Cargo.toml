
[package]
authors = ["xingwangzhe"]
edition = "2021"
name = "force-rs"
version = "0.3.0"
description = "Fast force-directed 3D graph layout with Barnes-Hut octree and Rayon parallelism"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.14.2"
napi-derive = "3.6.12"
rayon = "1.12.0"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
